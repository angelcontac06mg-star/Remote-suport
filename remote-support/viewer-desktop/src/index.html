<!doctype html><html lang="es"><head><meta charset="utf-8"><title>RemoteAssist Viewer</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: stun: turn: turns:; media-src 'self' blob:">
<style>
body{margin:0;background:#1b1b19;color:#ecebe6;font:15px system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column;height:100vh}
#bar{display:flex;gap:8px;padding:10px;border-bottom:1px solid #383835;align-items:center}
input{width:110px;padding:7px;background:transparent;color:inherit;border:1px solid #555;border-radius:3px;font-size:16px;letter-spacing:3px}
button{padding:7px 12px;background:#2d4a3e;color:#fff;border:0;border-radius:3px;cursor:pointer}
button.n{background:#444}#st{color:#9a9992;font-size:13px;margin-left:auto}
video{flex:1;min-height:0;width:100%;background:#000;object-fit:contain;touch-action:none}
#nav{display:flex;gap:8px;padding:8px;justify-content:center;border-top:1px solid #383835}
</style></head><body>
<div id="bar"><input id="cd" maxlength="6" inputmode="numeric" autocomplete="one-time-code" aria-label="Código de sesión" placeholder="Código"><button id="go">Conectar</button><span id="st" role="status" aria-live="polite"></span></div>
<video id="v" autoplay playsinline muted></video>
<div id="nav"><button class="n" data-k="back">Atrás</button><button class="n" data-k="home">Inicio</button><button class="n" data-k="recents">Recientes</button></div>
<script>
const $=id=>document.getElementById(id),v=$('v'),go=$('go'),code=$('cd');
const st=t=>$('st').textContent=t;
let ws=null,pc=null,dc=null,queue=Promise.resolve(),down=null,joining=false;
const send=o=>{if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(o));};
const ctl=o=>{if(dc?.readyState==='open')dc.send(JSON.stringify(o));};
function resetPeer(){
  down=null;dc?.close();dc=null;pc?.close();pc=null;v.srcObject=null;
}
function disconnect(message='Sesión terminada'){
  resetPeer();joining=false;go.disabled=false;st(message);
  if(ws&&ws.readyState!==WebSocket.CLOSED)ws.close();
  ws=null;
}
go.onclick=()=>{
  if(joining)return;
  const c=code.value.trim();
  if(!/^\d{6}$/.test(c)){st('Escribe los 6 números del código');code.focus();return;}
  disconnect('Conectando...');
  joining=true;go.disabled=true;queue=Promise.resolve();
  const socket=new WebSocket(cfg.signalingUrl);ws=socket;
  socket.onopen=()=>{if(ws===socket)send({type:'join',code:c});};
  socket.onerror=()=>{if(ws===socket)st('No se pudo conectar al servidor');};
  socket.onclose=()=>{if(ws===socket){resetPeer();joining=false;go.disabled=false;ws=null;st('Sesión terminada');}};
  socket.onmessage=e=>{
    if(ws!==socket)return;
    queue=queue.then(()=>onMsg(JSON.parse(e.data))).catch(err=>{console.error(err);disconnect('Falló la negociación WebRTC');});
  };
};
async function onMsg(d){
  if(d.type==='error'){disconnect(d.msg||'No se pudo conectar');return;}
  if(d.type==='peer-left'||d.type==='session-ended'){disconnect('El teléfono terminó la sesión');return;}
  if(d.type==='joined'){st('Esperando al teléfono…');return;}
  if(d.type==='offer'){
    resetPeer();
    pc=new RTCPeerConnection({iceServers:cfg.iceServers});
    pc.onicecandidate=e=>e.candidate&&send({type:'ice',candidate:e.candidate.candidate,sdpMid:e.candidate.sdpMid,sdpMLineIndex:e.candidate.sdpMLineIndex});
    pc.ontrack=e=>{v.srcObject=e.streams[0];joining=false;go.disabled=false;st('Conectado');};
    pc.onconnectionstatechange=()=>{
      if(!pc)return;
      if(pc.connectionState==='failed')disconnect('Falló la conexión de video; revisa la red o el servidor TURN');
      else if(pc.connectionState==='disconnected')st('Conexión interrumpida…');
    };
    pc.ondatachannel=e=>{dc=e.channel;};
    await pc.setRemoteDescription({type:'offer',sdp:d.sdp});
    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    send({type:'answer',sdp:pc.localDescription.sdp});
  }else if(d.type==='ice'&&pc){
    await pc.addIceCandidate({candidate:d.candidate,sdpMid:d.sdpMid,sdpMLineIndex:d.sdpMLineIndex});
  }
}
function norm(e){
  if(!v.videoWidth||!v.videoHeight)return null;
  const r=v.getBoundingClientRect(),s=Math.min(r.width/v.videoWidth,r.height/v.videoHeight);
  const w=v.videoWidth*s,h=v.videoHeight*s,ox=(r.width-w)/2,oy=(r.height-h)/2;
  const c=n=>Math.min(1,Math.max(0,n));
  return{x:c((e.clientX-r.left-ox)/w),y:c((e.clientY-r.top-oy)/h)};
}
v.addEventListener('pointerdown',e=>{const p=norm(e);if(!p)return;v.setPointerCapture(e.pointerId);down={...p,px:e.clientX,py:e.clientY,t:Date.now()};});
v.addEventListener('pointerup',e=>{
  if(!down)return;const u=norm(e);
  if(u){const moved=Math.hypot(e.clientX-down.px,e.clientY-down.py)>12;
    if(moved)ctl({t:'swipe',x1:down.x,y1:down.y,x2:u.x,y2:u.y,ms:Math.min(800,Math.max(120,Date.now()-down.t))});
    else ctl({t:'tap',x:u.x,y:u.y});}
  down=null;
});
v.addEventListener('pointercancel',()=>{down=null;});
v.addEventListener('wheel',e=>{e.preventDefault();ctl({t:'scroll',dy:Math.sign(e.deltaY)});},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||!dc)return;
  if(e.key==='Backspace')ctl({t:'del'});else if(e.key.length===1)ctl({t:'text',s:e.key});
});
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>ctl({t:'nav',k:b.dataset.k}));
</script></body></html>
